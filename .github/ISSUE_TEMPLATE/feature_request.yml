name: Feature request / درخواست قابلیت
description: Ask for a new chip, peripheral option, example or tool feature. / درخواست تراشه، پریفرال، نمونه یا قابلیت جدید.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like? / چه چیزی لازم دارید؟
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip(s) / تراشه‌ها
      placeholder: PY32F031
  - type: textarea
    id: why
    attributes:
      label: What is it for? / کاربردش چیست؟
